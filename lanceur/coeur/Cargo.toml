[package]
name = "bbass-lanceur-coeur"
version = "0.1.0"
edition = "2021"
publish = false
description = "Logique du Lanceur BBASS sans fenêtre ni réseau distant, testée par cargo test."

[dependencies]
# Clés et signatures du Paquet poste en texte (secret GitHub, fichier committé, .sig).
base64 = "0.22"
# Signature du Paquet poste (ADR-0022).
ed25519-dalek = "2"
# Graine de la paire de clés générée par `cle-poste generer`.
getrandom = "0.2"
# Fichiers d'état (installation, dernière vérification) et configuration.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Décompression du Paquet poste (zip Deflate de Compress-Archive).
zip = { version = "2", default-features = false, features = ["deflate"] }
