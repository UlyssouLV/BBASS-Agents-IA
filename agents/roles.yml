# Skills refer to roles. Paths live only here.
# Lookup: roles.<name>.paths  (always a list)
#
# Unresolved (key missing, or a listed path not on disk): **stop**.
# Do not skip. Do not invent a path or file. Do not continue later steps.
# Tell the user: to continue, run **Créer <name>** (creates the missing
# file and, if needed, the key here). A listed directory that exists may
# be empty.

roles:
  roadmap:
    paths:
      - docs/dev/feuille-de-route/feuille-de-route-dev.md
  suivi-avancement:
    paths:
      - docs/suivi-avancement/
  glossary:
    paths:
      - docs/glossaire.md
  spec:
    paths:
      - docs/specs/
  adr:
    paths:
      - docs/adr/
  docs-site:
    paths:
      - docs-site/
  readme:
    paths:
      - README.md
  agent-adapter:
    paths:
      - AGENTS.md
      - .claude/CLAUDE.md
      - agents/
  test-roots:
    paths:
      - vm-centrale
      - poste
      - lanceur
  # Ce qui atteint l'utilisateur final : images VM (vm-centrale/Dockerfile,
  # searxng) et Paquet poste (lanceur/scripts/construire-paquet.ps1). Lu par
  # finaliser-la-version : diff hors tests/ et *.md sur ces chemins → Release.
  livrables:
    paths:
      - vm-centrale/Dockerfile
      - vm-centrale/pyproject.toml
      - vm-centrale/uv.lock
      - vm-centrale/.python-version
      - vm-centrale/src
      - vm-centrale/deploiement
      - searxng
      - poste/pyproject.toml
      - poste/uv.lock
      - poste/.python-version
      - poste/src
      - poste/frontend
      - lanceur
