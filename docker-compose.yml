services:
  postgres:
    image: postgres:16-alpine
    container_name: bbass-vm-centrale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vm_centrale
      POSTGRES_PASSWORD: vm_centrale
      POSTGRES_DB: vm_centrale
    ports:
      - "5432:5432"
    volumes:
      - vm_centrale_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vm_centrale -d vm_centrale"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vm_centrale_postgres_data:
