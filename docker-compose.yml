services:
  postgres:
    image: postgres:16-alpine
    container_name: bbass-vm-centrale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - vm_centrale_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Moteur de recherche de l'outil rechercher_web (spec 1.4.0, ADR-0013).
  # Image épinglée et settings.yml : searxng/Dockerfile. Publié sur
  # localhost seulement.
  searxng:
    build: ./searxng
    image: bbass-vm-centrale-searxng
    container_name: bbass-vm-centrale-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"

volumes:
  vm_centrale_postgres_data:
