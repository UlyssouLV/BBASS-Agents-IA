name: Build docs

# Check de PR, et build réutilisé par deploy-docs.yml sur main (workflow_call) :
# une seule définition du build Docusaurus.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      upload-pages:
        description: Publie docs-site/build comme artefact Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Path filter en job (pas au niveau workflow) : un skip par `if` compte
  # Success pour le ruleset (skip→vert). Un `paths:` sur `on:` laisserait le
  # check required en Pending.
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'docs-site/**'
              - 'poste/frontend/**'
              - 'vm-centrale/src/vm_centrale/moduleo/docs/**'
              - '.github/workflows/build-docs.yml'

  build-docs:
    name: build-docs
    needs: changes
    # Appelé par deploy-docs : changes est skipped, on build toujours.
    if: >-
      !failure() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site
        working-directory: docs-site
        run: npm ci --ignore-scripts

      # prebuild : compiler-css-poste lit poste/frontend
      - name: Install poste frontend
        working-directory: poste/frontend
        run: npm ci --ignore-scripts

      - name: Compteurs de commits
        working-directory: docs-site
        run: node scripts/generer-stats-commits.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build Docusaurus
        working-directory: docs-site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Pages artifact
        if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build
