name: Build docs

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Path filter en job (pas au niveau workflow) : un skip par `if` compte
  # Success pour le ruleset (skip→vert). Un `paths:` sur `on:` laisserait le
  # check required en Pending.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'docs-site/**'
              - 'poste/frontend/**'
              - 'vm-centrale/src/vm_centrale/moduleo/docs/**'
              - '.github/workflows/build-docs.yml'

  build-docs:
    name: build-docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site
        working-directory: docs-site
        run: npm ci --ignore-scripts

      # prebuild : compiler-css-poste lit poste/frontend
      - name: Install poste frontend
        working-directory: poste/frontend
        run: npm ci --ignore-scripts

      - name: Compteurs de commits
        working-directory: docs-site
        run: node scripts/generer-stats-commits.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build Docusaurus
        working-directory: docs-site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
