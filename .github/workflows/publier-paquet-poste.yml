# Publication du Paquet poste (spec 1.6.2, ADR-0022) : à chaque GitHub Release
# vX.Y.Z, construit bbass-poste-vX.Y.Z-windows-x64.zip (Lanceur, sidecar et
# front de ce tag, Lanceur à la version X.Y.Z), le signe en ed25519 avec le
# secret POSTE_CLE_SIGNATURE et joint à la Release le zip, sa signature,
# BBASS-Setup-vX.Y.Z.exe (le Lanceur suivi du zip signé : installation hors
# ligne) et SHA256SUMS. Le Lanceur des postes télécharge ce zip quand la VM
# passe à X.Y.Z.
name: Publier le paquet poste

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publier:
    name: Publier le paquet poste
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # Avant la construction (plusieurs minutes) : échouer tout de suite et clairement.
      - name: Tag de la Release au format vX.Y.Z
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Output "::error::Tag de Release « $env:TAG » : attendu vX.Y.Z. Aucun paquet poste publié."
            exit 1
          }

      - name: Clé de signature présente
        shell: pwsh
        env:
          POSTE_CLE_SIGNATURE: ${{ secrets.POSTE_CLE_SIGNATURE }}
        run: |
          if (-not $env:POSTE_CLE_SIGNATURE) {
            Write-Output "::error::Secret POSTE_CLE_SIGNATURE absent : impossible de signer le paquet poste. Le créer (guide dans l'ADR-0022), puis relancer ce workflow."
            exit 1
          }

      # Checkout du tag de la Release (défaut de l'événement release).
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: poste/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: lanceur

      # Échoue si BBASS.exe n'annonce pas la version X.Y.Z du tag.
      - name: Construire le paquet
        shell: pwsh
        run: ./lanceur/scripts/construire-paquet.ps1 -Version ($env:TAG.Substring(1))

      - name: Test de fumée
        shell: pwsh
        run: ./lanceur/scripts/test-fumee.ps1

      # Contenu du dossier à la racine du zip : il se décompresse dans versions\vX.Y.Z\.
      - name: Zip du paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publication | Out-Null
          Compress-Archive -Path lanceur/target/paquet/BBASS/* -DestinationPath "publication/bbass-poste-$env:TAG-windows-x64.zip"

      # La vérification avec la clé publique committée refuse un secret qui ne lui correspond pas.
      - name: Signer et vérifier
        shell: pwsh
        working-directory: lanceur
        env:
          POSTE_CLE_SIGNATURE: ${{ secrets.POSTE_CLE_SIGNATURE }}
        run: |
          $zip = "../publication/bbass-poste-$env:TAG-windows-x64.zip"
          cargo run --release --locked -q -p bbass-lanceur-coeur --bin cle-poste -- signer $zip
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo run --release --locked -q -p bbass-lanceur-coeur --bin cle-poste -- verifier $zip "$zip.sig"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::La signature ne se vérifie pas avec lanceur/cle-publique-poste.txt : POSTE_CLE_SIGNATURE n'est pas la clé secrète de cette clé publique."
            exit 1
          }

      # Le Setup embarque le zip signé ; setup-poste revérifie la signature avant d'assembler.
      - name: Setup
        shell: pwsh
        working-directory: lanceur
        run: |
          $zip = "../publication/bbass-poste-$env:TAG-windows-x64.zip"
          cargo run --release --locked -q -p bbass-lanceur-coeur --bin setup-poste -- target/release/BBASS.exe $zip "$zip.sig" "../publication/BBASS-Setup-$env:TAG.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: SHA256SUMS
        shell: pwsh
        working-directory: publication
        run: |
          $lignes = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS", ($lignes -join "`n") + "`n")

      - name: Joindre à la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG publication/* --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Résumé
        shell: pwsh
        working-directory: publication
        run: |
          "### Paquet poste $env:TAG publié" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content SHA256SUMS | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
