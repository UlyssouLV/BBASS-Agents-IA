name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
      - 'README.md'
    # Pas de paths-ignore : la boucle est coupée par [skip ci] sur le commit d’aperçu
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: docs-site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

      - name: Upload build for screenshot
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-build
          path: docs-site/build
          retention-days: 1

  capture-readme:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        working-directory: docs-site
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: docs-site-build
          path: docs-site/build

      - name: Serve and capture homepage
        working-directory: docs-site
        run: |
          node node_modules/@docusaurus/core/bin/docusaurus.mjs serve --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:4173/BBASS-Agents-IA/" >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run capturer-accueil
          npm run capturer-bugs

      - name: Capture suivi « Travail réalisé »
        working-directory: docs-site
        run: npm run capturer-travail-realise

      - name: Sync architecture Mermaid → README
        working-directory: docs-site
        run: npm run sync-architecture-readme

      - name: Commit screenshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/img/apercu-docs-accueil.png docs/img/apercu-docs-bugs.png docs/img/apercu-travail-realise.png README.md
          if git diff --staged --quiet; then
            echo "Aperçus inchangés."
            exit 0
          fi
          git commit -m "Met à jour les aperçus README (doc + suivi + archi) [skip ci]"
          # L'autre workflow (README stats / Deploy docs) a pu pousser sur main
          # depuis le checkout : rebase avant chaque essai de push.
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
