name: Deploy docs

# À chaque push sur main (pas seulement la doc) : le site publie aussi les
# compteurs de commits lus par les badges du README (static/stats/).
# Aperçus README : produits sur la branche de version (skill finaliser-la-version),
# jamais par un commit/push bot ici (ADR-0020 / V1.6.0).
# Pas de déclencheur release : Finalise crée la release avant le squash-merge,
# donc le push du merge redéploie déjà avec le changelog à jour.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-docs.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      upload-pages: true

  deploy:
    if: github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
