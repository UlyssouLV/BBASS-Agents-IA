name: Tests poste

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Path filter en job (pas au niveau workflow) : un skip par `if` compte
  # Success pour le ruleset (skip→vert). Un `paths:` sur `on:` laisserait le
  # check required en Pending.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      poste: ${{ steps.filter.outputs.poste }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            poste:
              - 'poste/**'
              - 'requirements-ci.txt'
              - '.coveragerc'
              - '.github/workflows/tests-poste.yml'

  tests-poste:
    name: tests-poste
    needs: changes
    if: needs.changes.outputs.poste == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            poste/pyproject.toml

      - name: Install
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements-ci.txt
          python -m pip install --only-binary :all: --no-binary poste --no-deps -e "./poste"

      - name: Tests poste
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          python -m pytest poste/tests \
            --rootdir=poste \
            -c poste/pyproject.toml \
            --cov=poste/src/poste \
            --cov-report=xml:coverage-poste.xml \
            --cov-branch \
            --cov-config=.coveragerc
