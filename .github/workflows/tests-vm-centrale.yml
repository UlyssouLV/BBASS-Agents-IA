name: Tests vm-centrale

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Path filter en job (pas au niveau workflow) : un skip par `if` compte
  # Success pour le ruleset (skip→vert). Un `paths:` sur `on:` laisserait le
  # check required en Pending.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      vm: ${{ steps.filter.outputs.vm }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vm:
              - 'vm-centrale/**'
              - 'requirements-ci.txt'
              - '.coveragerc'
              - '.github/workflows/tests-vm-centrale.yml'

  tests-vm-centrale:
    name: tests-vm-centrale
    needs: changes
    if: needs.changes.outputs.vm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            vm-centrale/pyproject.toml

      - name: Install
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements-ci.txt
          python -m pip install --only-binary :all: --no-binary vm-centrale --no-deps -e "./vm-centrale"

      - name: Tests vm-centrale
        run: |
          python -m pytest vm-centrale/tests \
            --rootdir=vm-centrale \
            -c vm-centrale/pyproject.toml \
            --cov=vm-centrale/src/vm_centrale \
            --cov-report=xml:coverage-vm.xml \
            --cov-branch \
            --cov-config=.coveragerc
