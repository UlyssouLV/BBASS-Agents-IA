sonar.projectKey=UlyssouLV_BBASS-Agents-IA
sonar.organization=ulyssoulv

sonar.python.version=3.11
# Rapports produits par le job sonar.yml lui-même (pytest --cov), pas par les
# workflows tests-* (ADR-0020, révision).
sonar.python.coverage.reportPaths=coverage-vm.xml,coverage-poste.xml
sonar.test.inclusions=vm-centrale/tests/**,poste/tests/**
# Outillage du suivi d'avancement (docs/suivi-avancement/*.py|*.mjs) : scripts de dev, comme scripts/**.
# exploitation.py : aiguillage des sous-commandes de l'image, prouvé par
# build-image-vm (le conteneur démarre sur `serveur`).
sonar.coverage.exclusions=agents/**,.claude/**,.cursor/**,vm-centrale/scripts/**,scripts/**,poste/frontend/**,docs-site/**,docs/**,vm-centrale/src/vm_centrale/exploitation.py
# Rapports de suivi HTML : même gabarit d'une semaine à l'autre, pas du code.
sonar.cpd.exclusions=docs/**
# Description WADL de l'API Moduléo (référence fournisseur, ~30k lignes) : pas du code,
# et elle ferait dépasser le plafond de lignes de l'organisation SonarCloud.
# Idem pour le hors-produit : rapports de suivi et doc (docs/), site Docusaurus
# (docs-site/, prouvé par build-docs) et front compilé du poste (dérivé de
# poste/frontend/, prouvé par build-front). Sans eux, l'analyse de main dépassait
# les 50 000 lignes de l'organisation et SonarCloud la refusait.
sonar.exclusions=vm-centrale/src/vm_centrale/moduleo/docs/**,docs/**,docs-site/**,poste/src/poste/static/**
