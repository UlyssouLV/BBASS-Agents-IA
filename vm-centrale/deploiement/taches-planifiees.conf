# Tâches planifiées de la VM centrale (spec 1.6.1, ADR-0021). Une ligne par
# tâche : `<nom> <OnCalendar systemd>`, où <nom> est une sous-commande
# `tache <nom>` de l'image (vm_centrale.taches.TACHES). `installer` et
# `mettre-a-jour` en tirent un timer bbass-<env>-<nom> par Environnement et
# retirent ceux qui ne sont plus déclarés ici. Journal d'une tâche :
#   journalctl -u bbass-<env>-<nom>
purger-cache-pages hourly
